name: docker-publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-plane
            context: .
            dockerfile: deploy/docker/control-plane.Dockerfile
          - name: worker
            context: .
            dockerfile: deploy/docker/worker.Dockerfile
          - name: planner
            context: planner
            dockerfile: planner/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=dev,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  summary:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Publish deployment tag summary
        run: |
          echo "Published Helios images for commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- $IMAGE_PREFIX/control-plane:sha-${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
          echo "- $IMAGE_PREFIX/worker:sha-${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
          echo "- $IMAGE_PREFIX/planner:sha-${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
