name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
      - name: Vet Go modules
        run: go vet ./...
      - name: Test Go modules
        run: |
          go test -race ./...

  postgres-recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: helios_test
          POSTGRES_USER: helios
          POSTGRES_PASSWORD: helios
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helios -d helios_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HELIOS_TEST_DATABASE_URL: postgres://helios:helios@127.0.0.1:5432/helios_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Verify lease expiry, retry, and terminal recovery
        run: go test -race -run TestStoreRecoversExpiredAttempts ./internal/store/postgres

  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install planner dependencies
        run: pip install -r planner/requirements.txt
      - name: Run Ruff
        run: python -m pip install ruff && ruff check .
      - name: Smoke import planner
        run: python -m py_compile planner/main.py

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Validate Docker Compose
        run: docker compose -f deploy/compose.yaml config
      - name: Render Kubernetes base
        run: kubectl kustomize deploy/k8s/base >/tmp/helios-base.yaml
      - name: Render Kubernetes dev overlay
        run: kubectl kustomize deploy/k8s/overlays/dev >/tmp/helios-dev.yaml
      - name: Render Kubernetes prod-like overlay
        run: kubectl kustomize deploy/k8s/overlays/prod-like >/tmp/helios-prod-like.yaml
