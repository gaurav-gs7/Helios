services:
  postgres:
    image: postgres:16-alpine
    container_name: helios-postgres
    environment:
      POSTGRES_DB: helios
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: helios
      TZ: ${TZ:-Asia/Kolkata}
      PGTZ: ${HELIOS_TIMEZONE:-Asia/Kolkata}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helios -d helios"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.11-alpine
    container_name: helios-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  planner:
    build:
      context: ../planner
      dockerfile: Dockerfile
    container_name: helios-planner
    env_file:
      - ../.env
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      HELIOS_TIMEZONE: ${HELIOS_TIMEZONE:-Asia/Kolkata}
      HELIOS_PLANNER_BACKEND: ${HELIOS_PLANNER_BACKEND:-gemini}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      GEMINI_API_BASE: ${GEMINI_API_BASE:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-20}
      HELIOS_RUNBOOK_DIR: /app/runbooks
    ports:
      - "8090:8090"

  control-plane:
    build:
      context: ..
      dockerfile: deploy/docker/control-plane.Dockerfile
    container_name: helios-control-plane
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      planner:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      HELIOS_TIMEZONE: ${HELIOS_TIMEZONE:-Asia/Kolkata}
      HELIOS_HTTP_ADDR: ":8080"
      HELIOS_GRPC_ADDR: ":8081"
      HELIOS_DATABASE_URL: postgres://helios:helios@postgres:5432/helios?sslmode=disable
      HELIOS_NATS_URL: nats://nats:4222
      HELIOS_PLANNER_URL: http://planner:8090
      HELIOS_ADMIN_TOKEN: change-me-admin-token
      HELIOS_WORKER_BOOTSTRAP_TOKEN: change-me-worker-bootstrap-token
      HELIOS_SCHEDULER_TICK: 1s
      HELIOS_SCHEDULER_POLICY: ${HELIOS_SCHEDULER_POLICY:-resource-aware}
      HELIOS_RECOVERY_TICK: 2s
      HELIOS_LEASE_DURATION: 20s
      HELIOS_HEARTBEAT_STALE_AFTER: 15s
      HELIOS_HEARTBEAT_DEAD_AFTER: 30s
    ports:
      - "8080:8080"
      - "8081:8081"

  worker:
    build:
      context: ..
      dockerfile: deploy/docker/worker.Dockerfile
    container_name: helios-worker
    depends_on:
      control-plane:
        condition: service_started
      nats:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      HELIOS_TIMEZONE: ${HELIOS_TIMEZONE:-Asia/Kolkata}
      HELIOS_CONTROL_PLANE_URL: http://control-plane:8080
      HELIOS_CONTROL_PLANE_GRPC_ADDR: control-plane:8081
      HELIOS_NATS_URL: nats://nats:4222
      HELIOS_WORKER_BOOTSTRAP_TOKEN: change-me-worker-bootstrap-token
      HELIOS_WORKER_HEARTBEAT_INTERVAL: 5s
      HELIOS_WORKER_VERSION: compose-demo
      HELIOS_WORKER_CAPACITY: ${HELIOS_WORKER_CAPACITY:-2}
      HELIOS_WORKER_CPU_CAPACITY_UNITS: ${HELIOS_WORKER_CPU_CAPACITY_UNITS:-2000}
      HELIOS_WORKER_MEMORY_CAPACITY_MB: ${HELIOS_WORKER_MEMORY_CAPACITY_MB:-1024}

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: helios-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts:/etc/prometheus/alerts:ro
    ports:
      - "9090:9090"
    depends_on:
      control-plane:
        condition: service_started
      planner:
        condition: service_started

  grafana:
    image: grafana/grafana:11.2.0
    container_name: helios-grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  postgres-data:
