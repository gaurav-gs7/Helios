apiVersion: v1
kind: ConfigMap
metadata:
  name: helios-config
  namespace: helios
data:
  TZ: "Asia/Kolkata"
  HELIOS_TIMEZONE: "Asia/Kolkata"
  HELIOS_HTTP_ADDR: ":8080"
  HELIOS_GRPC_ADDR: ":8081"
  HELIOS_DATABASE_URL: "postgres://helios:helios@postgres:5432/helios?sslmode=disable"
  HELIOS_NATS_URL: "nats://nats:4222"
  HELIOS_PLANNER_URL: "http://planner:8090"
  HELIOS_LEASE_DURATION: "20s"
  HELIOS_SCHEDULER_TICK: "1s"
  HELIOS_SCHEDULER_POLICY: "resource-aware"
  HELIOS_RECOVERY_TICK: "2s"
  HELIOS_HEARTBEAT_STALE_AFTER: "15s"
  HELIOS_HEARTBEAT_DEAD_AFTER: "30s"
  HELIOS_WORKER_HEARTBEAT_INTERVAL: "5s"
  HELIOS_MAX_REQUEST_BODY_BYTES: "1048576"
  HELIOS_SUBMISSION_RATE_PER_MINUTE: "60"
  HELIOS_HTTP_READ_TIMEOUT: "10s"
  HELIOS_HTTP_WRITE_TIMEOUT: "15s"
  HELIOS_HTTP_IDLE_TIMEOUT: "60s"
  HELIOS_HTTP_SHUTDOWN_TIMEOUT: "10s"
  HELIOS_CONTROL_PLANE_URL: "http://control-plane:8080"
  HELIOS_CONTROL_PLANE_GRPC_ADDR: "control-plane:8081"
  HELIOS_WORKER_CAPACITY: "2"
  HELIOS_WORKER_CPU_CAPACITY_UNITS: "2000"
  HELIOS_WORKER_MEMORY_CAPACITY_MB: "1024"
  HELIOS_PLANNER_BACKEND: "gemini"
  GEMINI_MODEL: "gemini-2.5-flash-lite"
  GEMINI_API_BASE: "https://generativelanguage.googleapis.com/v1beta"
  GEMINI_TIMEOUT_SECONDS: "20"
  HELIOS_RUNBOOK_DIR: "/app/runbooks"
