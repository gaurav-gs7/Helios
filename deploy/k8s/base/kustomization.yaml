apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - postgres.yaml
  - nats.yaml
  - planner.yaml
  - control-plane.yaml
  - worker.yaml

images:
  - name: helios/control-plane
    newName: ghcr.io/gauravgs7/helios/control-plane
    newTag: local
  - name: helios/worker
    newName: ghcr.io/gauravgs7/helios/worker
    newTag: local
  - name: helios/planner
    newName: ghcr.io/gauravgs7/helios/planner
    newTag: local
