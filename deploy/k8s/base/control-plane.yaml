apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: helios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      containers:
        - name: control-plane
          image: helios/control-plane:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: helios-config
            - secretRef:
                name: helios-secrets
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: helios
spec:
  selector:
    app: control-plane
  ports:
    - port: 8080
      targetPort: 8080
